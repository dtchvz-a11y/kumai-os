<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KUMAI OS</title>
<meta name="description" content="KUMAI OS · operación de KUMAI: recetario, pedidos, producción y dinero.">
<meta name="theme-color" content="#151617">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/chango-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/kumai.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>KUMAI OS</h1>
      <div class="sub" id="fechaHoy">—</div>
    </div>
    <div class="der">
      <button class="syncpill" id="syncpill" data-accion="app.sync" data-fase="sin-configurar" aria-live="polite"><i></i><span>Cargando</span></button>
    </div>
  </header>
  <main id="view"><div class="empty"><div class="big">Abriendo KUMAI OS</div></div></main>
  <button class="fab" id="fab" data-accion="pedidos.nuevo" aria-label="Nuevo pedido" hidden>+</button>
  <nav class="tabbar" id="tabbar" hidden>
    <button data-accion="app.ir" data-vista="hoy"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.7v2.1M10 16.2v2.1M18.3 10h-2.1M3.8 10H1.7M15.9 4.1l-1.5 1.5M5.6 14.4l-1.5 1.5M15.9 15.9l-1.5-1.5M5.6 5.6L4.1 4.1"/></svg>Hoy</button>
    <button data-accion="app.ir" data-vista="pedidos"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.6 6.4h14.8v2.2a1.4 1.4 0 0 0 0 2.8v2.2H2.6v-2.2a1.4 1.4 0 0 0 0-2.8z"/><path d="M12.2 6.4v7.2" stroke-dasharray="1.5 1.7"/></svg>Pedidos</button>
    <button data-accion="app.ir" data-vista="produccion"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.4"/><path d="M10 5.7V10l2.9 1.9"/></svg>Producción</button>
    <button data-accion="app.ir" data-vista="inventario"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.7 17.3 6v8L10 17.3 2.7 14V6z"/><path d="M2.7 6 10 9.4 17.3 6M10 9.4v7.9"/></svg>Insumos</button>
    <button data-accion="app.ir" data-vista="ventas"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5V10M8 16.5V4.5M13 16.5V8M17.5 16.5V6"/></svg>Ventas</button>
    <button data-accion="app.ir" data-vista="dinero"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.3" y="5.4" width="15.4" height="9.2" rx="1.2"/><circle cx="10" cy="10" r="2.2"/></svg>Dinero</button>
    <button data-accion="app.ir" data-vista="mas"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/></svg>Más</button>
  </nav>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<noscript>KUMAI OS necesita JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
